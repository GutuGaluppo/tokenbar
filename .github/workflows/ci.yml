name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compilar e testar
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Selecionar Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # O runner não tem o certificado do projeto: compila sem assinatura.
      - name: Testes (Swift Testing)
        run: |
          set -o pipefail
          xcodebuild test \
            -project TokenBar.xcodeproj \
            -scheme TokenBar \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | grep -v "com.apple.linkd"

      - name: Compilar Release
        run: |
          set -o pipefail
          xcodebuild build \
            -project TokenBar.xcodeproj \
            -scheme TokenBar \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Guardar resultados dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/TestResults.xcresult
